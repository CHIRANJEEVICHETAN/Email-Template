<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Avyren · Email Signature Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* Avyren palette — deep navy + clean blue */
    --ink:        #0A1628;        /* deep navy ink */
    --ink-2:      #16263F;        /* navy 2 */
    --ink-3:      #2A3D5C;        /* navy 3 */
    --muted:      #5C6B82;        /* secondary text */
    --muted-2:    #8595AC;        /* tertiary */
    --line:       #E4E8EF;        /* hairline */
    --line-2:     #EFF2F7;        /* softer line */
    --bg:         #F6F7FB;        /* app bg */
    --bg-2:       #FAFBFD;        /* card-on-bg lift */
    --paper:      #FFFFFF;        /* surface */
    --accent:     #1E5BD6;        /* Avyren blue */
    --accent-2:   #0E3FA8;        /* deeper */
    --accent-soft:#E8F0FF;        /* tinted bg */
    --success:    #0A7A4F;
    --warn:       #B8530B;
    --danger:     #B42318;
    --radius:     10px;
    --radius-sm:  6px;
    --radius-lg:  14px;
    --shadow-sm:  0 1px 2px rgba(10,22,40,.05), 0 0 0 1px rgba(10,22,40,.04);
    --shadow:     0 4px 14px -4px rgba(10,22,40,.10), 0 0 0 1px rgba(10,22,40,.05);
    --shadow-lg:  0 24px 60px -20px rgba(10,22,40,.25), 0 0 0 1px rgba(10,22,40,.06);
    --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: "Instrument Serif", "Times New Roman", serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "ss01", "cv11";
    line-height: 1.45;
  }

  /* ── App shell ───────────────────────────────────────── */
  .app {
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
  }

  /* Top bar */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 40;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 30px; height: 30px;
    border-radius: 8px;
    background: linear-gradient(140deg, var(--ink) 0%, var(--accent) 130%);
    display: grid; place-items: center;
    color: #fff;
    font-family: var(--serif);
    font-size: 19px;
    font-style: italic;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), 0 1px 2px rgba(10,22,40,.2);
  }
  .brand-name {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .brand-sub {
    font-size: 12px;
    color: var(--muted);
    margin-left: 2px;
    padding-left: 12px;
    border-left: 1px solid var(--line);
  }
  .topbar-actions { display: flex; gap: 8px; align-items: center; }

  /* Buttons */
  .btn {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    line-height: 1;
    padding: 9px 14px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: all .15s ease;
    white-space: nowrap;
  }
  .btn:hover { background: var(--bg-2); border-color: #D7DCE6; }
  .btn:active { transform: translateY(1px); }
  .btn-primary {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }
  .btn-primary:hover { background: var(--ink-2); border-color: var(--ink-2); }
  .btn-accent {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    box-shadow: 0 1px 0 rgba(255,255,255,.2) inset, 0 1px 2px rgba(30,91,214,.3);
  }
  .btn-accent:hover { background: var(--accent-2); border-color: var(--accent-2); }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn-ghost:hover { background: var(--bg-2); color: var(--ink); }
  .btn-sm { padding: 6px 10px; font-size: 12px; }
  .btn-icon { padding: 8px; }

  /* Main grid */
  .main {
    display: grid;
    grid-template-columns: minmax(420px, 520px) 1fr;
    gap: 0;
    min-height: 0;
  }
  @media (max-width: 1024px) {
    .main { grid-template-columns: 1fr; }
  }

  /* Form column */
  .form-col {
    background: var(--paper);
    border-right: 1px solid var(--line);
    overflow-y: auto;
    max-height: calc(100vh - 60px);
  }
  .form-inner { padding: 28px 32px 64px; }

  .pageheader { margin-bottom: 28px; }
  .pageheader h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 32px;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
    line-height: 1.1;
  }
  .pageheader h1 em {
    font-style: italic;
    color: var(--accent);
  }
  .pageheader p {
    margin: 0;
    font-size: 13.5px;
    color: var(--muted);
    max-width: 44ch;
    line-height: 1.5;
  }

  /* Section */
  .section { margin-bottom: 28px; }
  .section-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line-2);
  }
  .section-title .num {
    width: 18px; height: 18px;
    border-radius: 4px;
    background: var(--ink);
    color: #fff;
    display: grid; place-items: center;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0;
  }

  /* Field */
  .field-row {
    display: grid;
    gap: 12px;
    margin-bottom: 12px;
  }
  .field-row.cols-2 { grid-template-columns: 1fr 1fr; }
  @media (max-width: 600px) {
    .field-row.cols-2 { grid-template-columns: 1fr; }
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .field label {
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-2);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .field label .opt {
    font-size: 10px;
    font-weight: 400;
    color: var(--muted-2);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .input-wrap .prefix {
    position: absolute;
    left: 11px;
    color: var(--muted-2);
    pointer-events: none;
    display: flex;
    align-items: center;
    font-size: 13px;
  }
  .input-wrap.has-prefix input { padding-left: 32px; }
  .input, input[type="text"], input[type="email"], input[type="tel"], input[type="url"] {
    width: 100%;
    font-family: var(--sans);
    font-size: 13.5px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    line-height: 1.3;
    transition: border-color .12s, box-shadow .12s;
    outline: none;
  }
  .input::placeholder, input::placeholder { color: var(--muted-2); }
  .input:hover, input:hover { border-color: #CBD2DD; }
  .input:focus, input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(30, 91, 214, 0.15);
  }
  .input.error, input.error {
    border-color: var(--danger);
    box-shadow: 0 0 0 3px rgba(180, 35, 24, 0.12);
  }
  .field-error {
    font-size: 11.5px;
    color: var(--danger);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .field-hint {
    font-size: 11.5px;
    color: var(--muted-2);
  }

  /* Photo uploader */
  .photo-uploader {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px;
    border: 1px dashed var(--line);
    border-radius: 10px;
    background: var(--bg-2);
    transition: all .15s;
  }
  .photo-uploader:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .photo-preview {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, #E8F0FF, #C9DBF9);
    overflow: hidden;
    flex-shrink: 0;
    display: grid; place-items: center;
    border: 2px solid var(--paper);
    box-shadow: 0 0 0 1px var(--line);
    color: var(--accent);
    font-weight: 600;
    font-size: 22px;
    font-family: var(--serif);
  }
  .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
  .photo-info { flex: 1; min-width: 0; }
  .photo-info .name {
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    margin-bottom: 2px;
  }
  .photo-info .meta { font-size: 11.5px; color: var(--muted); }
  .photo-actions { display: flex; gap: 6px; }

  /* Social rows */
  .social-row {
    display: grid;
    grid-template-columns: 32px 1fr auto;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .social-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--bg-2);
    display: grid; place-items: center;
    color: var(--ink-2);
    border: 1px solid var(--line);
  }
  .social-row input { padding: 8px 10px; font-size: 13px; }

  /* Right column: Preview */
  .preview-col {
    background: var(--bg);
    overflow-y: auto;
    max-height: calc(100vh - 60px);
    position: relative;
  }
  .preview-inner {
    padding: 28px 32px 64px;
    max-width: 980px;
    margin: 0 auto;
  }

  .preview-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .preview-tabs {
    display: inline-flex;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 3px;
    gap: 2px;
  }
  .preview-tab {
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    border: none;
    background: transparent;
    border-radius: 6px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all .15s;
  }
  .preview-tab.active {
    background: var(--ink);
    color: #fff;
    box-shadow: 0 1px 2px rgba(10,22,40,.15);
  }
  .preview-tab:not(.active):hover { color: var(--ink); }

  .preview-actions { display: flex; gap: 8px; align-items: center; }

  /* Email mock window */
  .email-mock {
    background: var(--paper);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .email-mock-chrome {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-2);
  }
  .email-mock-chrome .dots { display: flex; gap: 6px; }
  .email-mock-chrome .dot {
    width: 11px; height: 11px; border-radius: 50%;
    background: #DCE0E8;
  }
  .email-mock-chrome .dot:nth-child(1) { background: #FF6058; }
  .email-mock-chrome .dot:nth-child(2) { background: #FFBF2E; }
  .email-mock-chrome .dot:nth-child(3) { background: #28C840; }
  .email-mock-chrome .url {
    font-size: 12px;
    color: var(--muted);
    font-family: var(--mono);
    margin-left: 12px;
  }
  .email-mock-body { padding: 24px 28px 32px; }
  .email-meta {
    border-bottom: 1px solid var(--line-2);
    padding-bottom: 14px;
    margin-bottom: 18px;
    font-size: 13px;
  }
  .email-meta-row { display: flex; gap: 8px; margin-bottom: 4px; }
  .email-meta-label { color: var(--muted); width: 60px; flex-shrink: 0; }
  .email-meta-value { color: var(--ink); }
  .email-subject {
    font-size: 18px;
    font-weight: 500;
    margin: 12px 0 4px;
    letter-spacing: -0.01em;
  }
  .email-body {
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.6;
    color: #333;
  }
  .email-body p { margin: 0 0 14px; }

  .signature-anchor {
    margin-top: 14px;
    padding-top: 4px;
    border-top: 1px dashed transparent;
    transition: border-color .2s;
  }
  .signature-anchor[data-highlight="true"] {
    border-top-color: var(--accent);
    background: linear-gradient(180deg, rgba(30,91,214,.04), transparent 30px);
  }

  /* Code/HTML preview */
  .html-preview {
    background: var(--ink);
    color: #C7D2E0;
    border-radius: 14px;
    padding: 0;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.55;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .html-preview-head {
    padding: 10px 14px;
    border-bottom: 1px solid #1E2D44;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: #8595AC;
    font-size: 11px;
    background: #06101D;
  }
  .html-preview pre {
    margin: 0;
    padding: 18px 20px;
    overflow-x: auto;
    max-height: 480px;
  }
  .html-preview .tag { color: #7DA9E8; }
  .html-preview .attr { color: #B5DCFF; }
  .html-preview .str { color: #F2C094; }
  .html-preview .com { color: #5C6B82; font-style: italic; }

  /* Toast */
  .toast-wrap {
    position: fixed;
    bottom: 24px; right: 24px;
    z-index: 100;
    display: flex; flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  .toast {
    pointer-events: auto;
    background: var(--ink);
    color: #fff;
    padding: 12px 16px;
    border-radius: 10px;
    box-shadow: var(--shadow-lg);
    display: flex; align-items: center; gap: 10px;
    font-size: 13px;
    min-width: 240px;
    animation: toastIn .25s ease;
  }
  .toast.success { background: #0A1628; border: 1px solid var(--success); }
  .toast .ico {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--success);
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(10, 22, 40, 0.45);
    backdrop-filter: blur(4px);
    z-index: 90;
    display: grid; place-items: center;
    padding: 20px;
    animation: fadeIn .15s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--paper);
    border-radius: 16px;
    box-shadow: var(--shadow-lg);
    width: 100%;
    max-width: 720px;
    max-height: 90vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    animation: modalIn .2s ease;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: translateY(8px) scale(.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .modal-head {
    padding: 18px 22px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-head h3 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 400;
    font-size: 22px;
    letter-spacing: -0.01em;
  }
  .modal-tabs {
    display: flex;
    gap: 4px;
    padding: 14px 22px 0;
    border-bottom: 1px solid var(--line);
  }
  .modal-tab {
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    border: none;
    background: transparent;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .modal-tab.active { color: var(--ink); border-bottom-color: var(--accent); }
  .modal-body {
    padding: 22px;
    overflow-y: auto;
    flex: 1;
  }

  /* Setup steps */
  .step {
    display: flex;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line-2);
  }
  .step:last-child { border-bottom: none; }
  .step-num {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    display: grid; place-items: center;
    font-size: 13px;
    font-weight: 600;
    flex-shrink: 0;
    border: 1px solid rgba(30,91,214,.2);
  }
  .step-content { flex: 1; min-width: 0; }
  .step-title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 4px;
    color: var(--ink);
  }
  .step-desc {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
  }
  .step-desc code {
    font-family: var(--mono);
    font-size: 11.5px;
    background: var(--bg-2);
    padding: 1px 6px;
    border-radius: 4px;
    border: 1px solid var(--line);
    color: var(--ink-2);
  }

  /* Tooltip-ish meta cards on right when empty */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 18px;
  }
  .stat {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .stat-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }
  .stat-value {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 400;
    line-height: 1;
    color: var(--ink);
  }
  .stat-value small {
    font-family: var(--sans);
    font-size: 11px;
    color: var(--muted);
    margin-left: 4px;
  }

  /* Iframe-rendered signature */
  .sig-frame {
    width: 100%;
    border: none;
    display: block;
  }

  /* Subtle animated highlight when copied */
  @keyframes pulseGlow {
    0% { box-shadow: 0 0 0 0 rgba(30,91,214,.4); }
    100% { box-shadow: 0 0 0 14px rgba(30,91,214,0); }
  }
  .pulse { animation: pulseGlow .8s ease-out; }

  /* Validation badge */
  .compat-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 12px;
  }
  .compat {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    color: var(--muted);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 9px 4px 6px;
  }
  .compat .check {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--success);
    color: white;
    display: grid; place-items: center;
    font-size: 9px;
  }

  /* Scrollbar polish */
  .form-col::-webkit-scrollbar, .preview-col::-webkit-scrollbar { width: 10px; }
  .form-col::-webkit-scrollbar-thumb, .preview-col::-webkit-scrollbar-thumb {
    background: #D7DCE6; border-radius: 10px; border: 2px solid var(--paper);
  }
  .preview-col::-webkit-scrollbar-thumb { border-color: var(--bg); }

  /* Empty preview state */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div id="root"></div>

  <!-- Speaker notes deliberately omitted -->

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="signature-templates.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
